---
namespace: cisco
name: fmcansible
version: 1.1.1
readme: README.md

authors:
  - joe Agster <joeaxcdw>
  - Iurii Tymoshevskyi <itymo>
  - Sameer Singh <sameesin>
  - Jeroen Wittock <jwittock>
  - Charan Teja <teande>
  - Suraj Netla Mundaje <snetlamu>

description: An Ansible collection for managing Cisco Secure Firewall Management Center

license_file: "LICENSE"

tags:
  - "cisco"
  - "security"
  - "firewall"
  - "fmc"
  - "ftd"
  - "automation"

dependencies:
  ansible.netcommon: ">=8.5.2"
  ansible.utils: ">=5.1.2"

repository: https://github.com/CiscoDevNet/FMCAnsible
homepage: https://github.com/CiscoDevNet/FMCAnsible
issues: https://github.com/CiscoDevNet/FMCAnsible/issues

build_ignore:
  # Repository and CI configuration
  - .github
  - .gitignore
  - ansible.cfg

  # Development and test tooling
  - tests
  - scripts
  - test-requirements.txt
  - Dockerfile
  - Dockerfile_integration
  - changelogs

  # Local and generated artifacts
  - "**/.DS_Store"
  - "**/__pycache__"
  - "**/.pytest_cache"
  - "**/tests/output"
  - .coverage
  - coverage.xml
  - "*.log"
  - "*.tar.gz"
